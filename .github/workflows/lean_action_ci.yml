name: Lean Action CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan, update manifest, and build
        run: |
          curl -sSf https://lean-lang.org | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          lake update
          lake exe cache get
          lake build
          
