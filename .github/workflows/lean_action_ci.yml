name: Lean Action CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://githubusercontent.com -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Generate lake-manifest.json if missing
        run: |
          if [ ! -f lake-manifest.json ]; then
            lake update
          fi
      - uses: leanprover/lean-action@v1
