name: Lean Action CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean toolchain
        run: |
          curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Update manifest, fetch Mathlib cache, and build
        run: |
          lake update
          lake exe cache get
          lake build
          
