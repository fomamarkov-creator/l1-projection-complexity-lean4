name: Lean Action CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and generate lake-manifest.json
        run: |
          if [ ! -f lake-manifest.json ]; then
            curl -sSfL https://githubusercontent.com -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
            rm elan-init.sh
            export PATH="$HOME/.elan/bin:$PATH"
            lake update
          fi
      - uses: leanprover/lean-action@v1
      
