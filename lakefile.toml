name = "MarkovL1Complexity"
version = "0.1.0"
keywords = ["math", "lean4", "complexity", "banach-spaces", "3sat", "verified-solver", "tactic"]
defaultTargets = ["MarkovL1Complexity", "MarkovL1Solver", "MarkovL1WeightedSolver", "MarkovL1Tactic"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "MarkovL1Complexity"

[[lean_lib]]
name = "MarkovL1Solver"

[[lean_lib]]
name = "MarkovL1WeightedSolver"

[[lean_lib]]
name = "MarkovL1Tactic"
