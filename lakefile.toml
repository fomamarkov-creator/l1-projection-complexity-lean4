name = "MarkovL1Complexity"
version = "0.3.0"
keywords = ["math", "lean4", "complexity", "banach-spaces", "3sat", "verified-solver", "tactic", "quantization"]
defaultTargets = ["MarkovL1Complexity", "MarkovL1Solver", "MarkovL1WeightedSolver", "MarkovL1Tactic", "MarkovL1Quantizer", "MarkovL1TernaryQuantizer", "MarkovL1WeightedTernary", "MarkovL1TreewidthSolver", "l1solver"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "MarkovL1Complexity"

[[lean_lib]]
name = "MarkovL1Solver"

[[lean_lib]]
name = "MarkovL1WeightedSolver"

[[lean_lib]]
name = "MarkovL1Tactic"

[[lean_lib]]
name = "MarkovL1Quantizer"

[[lean_lib]]
name = "MarkovL1TernaryQuantizer"

[[lean_lib]]
name = "MarkovL1WeightedTernary"

[[lean_lib]]
name = "MarkovL1TreewidthSolver"

[[lean_exe]]
name = "l1solver"
root = "Main"

[[lean_lib]]
name = "MarkovL1ContinuousChainDP"

[[lean_lib]]
name = "MarkovL1TriangularActivation"

[[lean_lib]]
name = "MarkovL1GeneralTreewidthFPT"

[[lean_lib]]
name = "MarkovL1NextGenQuantizer"

[[lean_lib]]
name = "MarkovL1SuperQuantizer"

[[lean_lib]]
name = "MarkovL1UltimateE8Engine"

[[lean_lib]]
name = "MarkovL1AttentionKVCache"

[[lean_lib]]
name = "MarkovL1LeechAndLowRank"

[[lean_lib]]
name = "MarkovL1EntropyAndSparsity"

[[lean_lib]]
name = "MarkovL1MoERoutingAndDynamicBits"

[[lean_lib]]
name = "MarkovL1ZeroKnowledgeInferenceCert"

[[lean_lib]]
name = "MarkovL1HCPAndBirkhoffQuantizer"

[[lean_lib]]
name = "MarkovL1FullTransformerCert"

[[lean_lib]]
name = "MarkovL1RoPEAndGolaySyndrome"
